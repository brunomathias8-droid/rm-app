<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4E1730">
<title>RM</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icones/icone-192.png">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RM">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* ============ Tokens da marca RM Confeitaria do dia a dia ============ */
:root{
  --ameixa:#4E1730;--ameixa2:#6A2644;--rosa:#C98695;--rosaT:#E3B3BE;--rosaC:#F4E4E4;
  --linho:#F4ECE2;--papel:#FFFCF8;--tinta:#231318;--sub:#6B5560;--sub2:#8C7A80;--linha:#E6DACE;--ouro:#7A5A1E;
  --ok:#2E6B4F;--okC:#E1EFE6;--err:#A5281B;--errC:#FBE5E1;--av:#8A5A00;--avC:#FBEFD6;
  --serif:'DM Serif Display',Georgia,serif;--sans:'Nunito Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --r:16px;--r2:12px;--sh:0 1px 2px rgba(35,19,24,.06),0 2px 10px rgba(35,19,24,.05);
  --top:calc(54px + env(safe-area-inset-top,0px));--tab:64px;--safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--linho);color:var(--tinta);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ameixa)}
:focus-visible{outline:3px solid var(--rosa);outline-offset:2px;border-radius:8px}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:22px;height:22px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:18px;height:18px}

/* ============ Barra superior ============ */
.top{position:fixed;top:0;left:0;right:0;z-index:20;height:var(--top);padding-top:env(safe-area-inset-top,0px)!important;display:flex;align-items:center;gap:8px;padding:0 8px 0 14px;background:rgba(78,23,48,.97);color:var(--linho);backdrop-filter:saturate(1.4) blur(8px)}
.top .bm{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.top .bm-rm{font:22px/1 var(--serif);color:var(--linho)}
.top .bm-t{font:italic 16px/1 var(--serif);color:var(--rosaT);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tt{font:17px/1 var(--serif);flex:1;text-align:center}
.ib{width:44px;height:44px;border:0;border-radius:12px;background:none;color:inherit;display:flex;align-items:center;justify-content:center}
.ib:active{background:rgba(255,255,255,.12)}
.ib.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ Página ============ */
main{padding:calc(var(--top) + 8px) 16px calc(var(--tab) + var(--safe) + 28px);max-width:600px;margin:0 auto}
body.form main{padding-bottom:calc(var(--safe) + 150px)}
.page{animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.lt{padding:10px 2px 14px}
.lt small{display:block;font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ouro)}
.lt h1{margin:2px 0 0;font:32px/1.1 var(--serif);font-weight:400;color:var(--ameixa)}
.lt p{margin:6px 0 0;color:var(--sub);font-size:15px}
.sec{margin:22px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec h2{margin:0;font:21px/1.2 var(--serif);font-weight:400;color:var(--ameixa)}
.sec .cnt{font-size:14px;color:var(--sub);font-weight:700}
.sec button.lk{border:0;background:none;color:var(--ameixa);font-weight:700;font-size:15px;padding:8px 0}
.card{background:var(--papel);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;margin:0 0 10px}
.card.flat{box-shadow:none;border:1px solid var(--linha)}
.list{background:var(--papel);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin:0 0 10px}
.muted{color:var(--sub);font-size:14px}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}

/* ============ Hero (semana) ============ */
.hero{background:var(--ameixa);color:var(--linho);border-radius:20px;padding:18px 18px 16px;position:relative;overflow:hidden;box-shadow:0 6px 20px rgba(78,23,48,.25)}
.hero .lbl{font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--rosaT)}
.hero .big{font:40px/1.05 var(--serif);margin:8px 0 2px}
.hero .big small{font:15px var(--sans);color:var(--rosaT);margin-left:4px}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.16);overflow:hidden;margin:12px 0 12px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--rosa);transition:width .6s ease}
.bar.ok i{background:#8FD0AE}
.hero .stats{display:flex;gap:18px;font-size:14px;color:var(--rosaT)}
.hero .stats b{display:block;font:20px/1.1 var(--serif);color:var(--linho)}
/* carimbo "Fornada nº" retirado em 03/10/2026 (marca final) */

/* ============ Atalhos ============ */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 0}
.tile{border:0;background:var(--papel);box-shadow:var(--sh);border-radius:var(--r);padding:12px 10px 11px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:96px}
.tile .ic{width:34px;height:34px;border-radius:10px;background:var(--rosaC);color:var(--ameixa);display:flex;align-items:center;justify-content:center}
.tile b{font:24px/1 var(--serif);font-weight:400}
.tile span{font-size:13px;color:var(--sub);line-height:1.2}
.tile.alert .ic{background:var(--errC);color:var(--err)}
.tile.alert b{color:var(--err)}
.tile:active{transform:scale(.98)}

/* ============ Linhas de lista (tarefas, plano) ============ */
.li{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-bottom:1px solid var(--linha);min-height:52px}
.li:last-child{border-bottom:0}
.li .tx{flex:1;min-width:0;font-size:16px;line-height:1.35}
.li .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;font-size:13px;color:var(--sub);align-items:center}
.li.done .tx>span:first-child{text-decoration:line-through;color:var(--sub2)}
.li.tap{cursor:pointer}
.li.tap:active{background:var(--rosaC)}
.ck{width:28px;height:28px;flex:0 0 28px;border-radius:50%;border:2px solid var(--ameixa);background:#fff;display:flex;align-items:center;justify-content:center;color:#fff;margin-top:-2px;transition:background .15s,transform .15s;padding:0}
.ck svg{width:16px;height:16px;stroke-width:3;opacity:0}
.ck.on{background:var(--ameixa)}
.ck.on svg{opacity:1}
.ck:active{transform:scale(.9)}
.dot{width:28px;flex:0 0 28px;display:flex;justify-content:center;padding-top:7px}
.dot i{width:8px;height:8px;border-radius:50%;background:var(--rosa)}
.star{width:28px;height:28px;flex:0 0 28px;border-radius:50%;background:var(--rosaC);color:var(--ameixa);display:flex;align-items:center;justify-content:center}
.chev{color:var(--sub2);align-self:center}

/* ============ Pills ============ */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--rosaC);color:var(--ameixa);white-space:nowrap;line-height:1.3}
.pill.ok{background:var(--okC);color:var(--ok)}
.pill.err{background:var(--errC);color:var(--err)}
.pill.av{background:var(--avC);color:var(--av)}
.pill.nd{background:#EEE8E4;color:var(--sub)}

/* ============ Pedido ============ */
.ord{background:var(--papel);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px 12px;margin:0 0 10px}
.ord .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ord .t b{font-size:17px}
.ord .t .v{font:19px/1 var(--serif);color:var(--ameixa);white-space:nowrap}
.ord .it{margin:4px 0 8px;color:var(--tinta);font-size:15px;line-height:1.35}
.ord .mt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--sub)}
.ord .ac{display:flex;gap:8px;margin-top:12px;align-items:center}
.etp{display:flex;align-items:center;gap:0;margin:2px 0 10px}
.etp .e{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--sub2);white-space:nowrap}
.etp .e i{width:18px;height:18px;border-radius:50%;border:2px solid #D9CBBE;box-sizing:border-box;display:flex;align-items:center;justify-content:center;flex:0 0 18px}
.etp .e.ok{color:var(--sub)} .etp .e.ok i{background:var(--ameixa);border-color:var(--ameixa)}
.etp .e.ok i svg{width:11px;height:11px;stroke:#fff;stroke-width:3}
.etp .e.at{color:var(--ameixa)} .etp .e.at i{border-color:var(--ameixa);background:var(--rosaC)}
.etp .ln{flex:1;height:2px;background:#E3D6C8;margin:0 6px;min-width:10px}
.etp .ln.ok{background:var(--ameixa)}
.pixb{border:0;cursor:pointer;font-family:inherit}
.stg{margin:14px 0 4px}
.stg .lab{display:block;font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--sub);margin:0 0 8px}
.stg .seg{margin:0}
.ord.sai{animation:sai .28s ease-in forwards}
@keyframes sai{to{opacity:0;transform:translateX(24px)}}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:14px;padding:12px 18px;font-size:17px;font-weight:800;background:var(--ameixa);color:#fff;text-decoration:none}
.btn:active{background:var(--ameixa2)}
.btn:disabled{opacity:.45}
.btn.sec{background:var(--rosaC);color:var(--ameixa)}
.btn.ghost{background:none;color:var(--ameixa);border:1.5px solid var(--linha)}
.btn.danger{background:var(--errC);color:var(--err)}
.btn.sm{min-height:42px;font-size:15px;border-radius:12px;padding:8px 14px;width:auto;flex:1}
.btn.ok{background:var(--ok)}
.icb{width:42px;height:42px;flex:0 0 42px;border-radius:12px;border:1.5px solid var(--linha);background:var(--papel);color:var(--ameixa);display:flex;align-items:center;justify-content:center;text-decoration:none}
.icb.wa{color:#1E7A45}
.grp{position:sticky;top:var(--top);z-index:5;background:var(--linho);padding:12px 2px 8px;display:flex;justify-content:space-between;align-items:baseline}
.grp b{font:19px/1.2 var(--serif);font-weight:400;color:var(--ameixa)}
.grp span{font-size:13px;color:var(--sub);font-weight:700}

/* ============ Controles ============ */
.seg{display:flex;background:#EADFD3;border-radius:12px;padding:3px;margin:0 0 14px}
.seg button{flex:1;border:0;background:none;min-height:38px;border-radius:9px;font-size:15px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--papel);color:var(--ameixa);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--linha);background:var(--papel);border-radius:999px;min-height:40px;padding:8px 14px;font-size:15px;font-weight:700;color:var(--tinta);white-space:nowrap}
.chip.on{background:var(--ameixa);border-color:var(--ameixa);color:#fff}
.fld{margin:0 0 14px}
.fld>label,.lab{display:block;font-size:13px;font-weight:800;color:var(--sub);letter-spacing:.3px;text-transform:uppercase;margin:0 0 6px}
input,select,textarea{width:100%;font-size:17px;padding:13px 14px;border:1.5px solid var(--linha);border-radius:12px;background:#fff;color:var(--tinta);-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--rosa);box-shadow:0 0 0 3px rgba(201,134,149,.22)}
textarea{min-height:84px;resize:vertical}
.money{position:relative}
.money span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--sub);font-weight:700}
.money input{padding-left:44px;font:26px var(--serif)}
.falta{border-color:var(--err)!important;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.tog .tx b{display:block;font-size:16px}
.tog .tx span{font-size:13px;color:var(--sub)}
.sw{width:52px;height:32px;flex:0 0 52px;border-radius:16px;background:#D9CCC2;border:0;position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.sw.on{background:var(--ok)}.sw.on::after{left:23px}
details.more{margin:6px 0 0}
details.more>summary{list-style:none;display:flex;align-items:center;gap:6px;min-height:44px;font-weight:800;color:var(--ameixa);cursor:pointer}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary svg{transition:transform .2s}
details.more[open]>summary svg{transform:rotate(90deg)}

/* Autocomplete */
.ac-list{margin:6px 0 0;border:1.5px solid var(--linha);border-radius:12px;background:#fff;overflow:hidden}
.ac-list button{display:flex;width:100%;align-items:center;gap:10px;border:0;border-bottom:1px solid var(--linha);background:#fff;min-height:48px;padding:10px 14px;text-align:left;font-size:16px}
.ac-list button:last-child{border-bottom:0}
.ac-list button:active{background:var(--rosaC)}
.ac-list .av{width:30px;height:30px;border-radius:50%;background:var(--rosaC);color:var(--ameixa);font:15px var(--serif);display:flex;align-items:center;justify-content:center}
.aviso{display:flex;gap:10px;align-items:flex-start;background:var(--rosaC);color:var(--ameixa);border-radius:12px;padding:11px 12px;font-size:14px;font-weight:700;margin:10px 0 0}
.aviso.av{background:var(--avC);color:var(--av)}
.msgc{background:var(--papel);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin:0 0 14px}
.msgc h2{margin:0;font:21px/1.2 var(--serif);font-weight:400;color:var(--ameixa)}
.msgc .onde{margin:4px 0 12px;color:var(--sub);font-size:14px;line-height:1.4}
.msgc textarea{min-height:110px;font-size:16px;line-height:1.45}
.msgc .cps{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;align-items:center}
.msgc .cps span{font-size:13px;color:var(--sub);font-weight:700;margin-right:2px}
.msgc .cps button{border:1.5px dashed var(--rosa);background:var(--rosaC);color:var(--ameixa);border-radius:999px;min-height:34px;padding:4px 12px;font-size:14px;font-weight:800}
.bolha{background:#E3F6D8;border-radius:4px 14px 14px 14px;padding:10px 12px;font-size:15px;line-height:1.45;white-space:pre-wrap;color:#1f2a1b;margin:6px 0 0;max-width:92%}
.prev{margin:14px 0 0}.prev .lab{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--sub)}
.msgc .acs{display:flex;gap:10px;align-items:center;margin-top:14px}

/* Produtos */
.prod{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--linha);transition:background .15s}
.prod:last-child{border-bottom:0}
.prod.sel{background:#FBF1F1}
.prod .nm{font-size:16px;line-height:1.3}
.prod .pr{font-size:14px;color:var(--sub)}
.step{display:flex;align-items:center;gap:4px}
.step button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--linha);background:#fff;color:var(--ameixa);display:flex;align-items:center;justify-content:center;padding:0}
.step button.plus{background:var(--ameixa);border-color:var(--ameixa);color:#fff}
.step output{min-width:26px;text-align:center;font:20px var(--serif);visibility:hidden}
.prod.sel .step output{visibility:visible}
.step .mn{visibility:hidden}
.prod.sel .step .mn{visibility:visible}

/* Opções grandes (retirada, categoria) */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1.5px solid var(--linha);background:var(--papel);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:64px}
.opt b{font-size:16px}
.opt span{font-size:13px;color:var(--sub)}
.opt svg{color:var(--ameixa);margin-bottom:4px}
.opt.on{border-color:var(--ameixa);background:#FBF1F1;box-shadow:inset 0 0 0 1px var(--ameixa)}

/* Barra de ação fixa (formulários) */
.actbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(255,252,248,.97);backdrop-filter:blur(8px);border-top:1px solid var(--linha);padding:10px 16px calc(10px + var(--safe))}
.actbar .in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:12px}
.actbar .sum{flex:1;min-width:0}
.actbar .sum b{display:block;font:24px/1.1 var(--serif);color:var(--ameixa)}
.actbar .sum span{font-size:13px;color:var(--sub);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actbar .sum span.err{color:var(--err);font-weight:700}
.actbar .btn{width:auto;flex:0 0 auto;padding:12px 22px}

/* ============ Tab bar ============ */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(255,252,248,.97);backdrop-filter:blur(8px);border-top:1px solid var(--linha);display:flex;justify-content:space-around;padding:6px 4px calc(6px + var(--safe));height:calc(var(--tab) + var(--safe))}
body.form .tabs{display:none}
.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--sub2);min-width:0}
.tabs button.on{color:var(--ameixa)}
.tabs button.on svg{stroke-width:2.3}
.tabs .fab{flex:0 0 auto;margin:-18px 6px 0;width:58px;height:58px;border-radius:50%;background:var(--ameixa);color:#fff;box-shadow:0 6px 16px rgba(78,23,48,.35);align-self:flex-start}
.tabs .fab svg{width:28px;height:28px;stroke-width:2.4}
.tabs .fab:active{transform:scale(.95)}

/* ============ Sheet (painel que sobe) ============ */
#sheet{position:fixed;inset:0;z-index:40;pointer-events:none}
#sheet .bg{position:absolute;inset:0;background:rgba(35,19,24,.4);opacity:0;transition:opacity .22s}
#sheet .sh{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--papel);border-radius:22px 22px 0 0;padding:8px 18px calc(18px + var(--safe));transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);max-width:600px;margin:0 auto}
#sheet.open{pointer-events:auto}
#sheet.open .bg{opacity:1}
#sheet.open .sh{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:#DDD0C6;margin:0 auto 12px}
.sh h3{margin:2px 0 4px;font:24px/1.2 var(--serif);font-weight:400;color:var(--ameixa)}
.sh .desc{margin:0 0 16px;color:var(--sub);font-size:15px}
.menu{display:flex;flex-direction:column;gap:10px;margin:8px 0 0}
.mi{display:flex;align-items:center;gap:14px;width:100%;border:0;background:#fff;border:1.5px solid var(--linha);border-radius:14px;padding:12px 14px;min-height:60px;text-align:left;text-decoration:none;color:var(--tinta)}
.mi .ic{width:40px;height:40px;border-radius:12px;background:var(--rosaC);color:var(--ameixa);display:flex;align-items:center;justify-content:center;flex:0 0 40px}
.mi b{display:block;font-size:16px}
.mi span{font-size:13px;color:var(--sub)}
.mi.danger .ic{background:var(--errC);color:var(--err)}
.mi.danger b{color:var(--err)}
.mi:active{background:var(--rosaC)}
.sucesso{width:64px;height:64px;border-radius:50%;background:var(--okC);color:var(--ok);display:flex;align-items:center;justify-content:center;margin:8px auto 10px}

/* API do Apps Script: POST com JSON em text/plain (evita a pré-verificação de CORS). Erro de sessão volta ao login. */
function api(corpo) {
  var url = (window.RM_CONFIG && RM_CONFIG.api) || '';   // só o config.js: endereço vindo de link levaria o token e o PIN para outro servidor
  if (!url) return Promise.reject(new Error('Endereço do servidor não configurado (config.js).'));
  var ctl = window.AbortController ? new AbortController() : null, tm = setTimeout(function () { if (ctl) ctl.abort(); }, 45000);
  return fetch(url, { method: 'POST', body: JSON.stringify(corpo), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', signal: ctl ? ctl.signal : undefined })
    .then(function (r) { clearTimeout(tm); if (!r.ok) throw new Error('Servidor respondeu ' + r.status + '. Tente de novo.'); return r.json().catch(function () { throw new Error('O servidor respondeu, mas não pelo Api.gs (falta publicar a versão nova?).'); }); },
      function (e) { clearTimeout(tm); if (e && e.name === 'AbortError') throw new Error('timeout'); if (navigator.onLine === false) throw new Error('Failed to fetch');
        var x = new Error('O servidor não atendeu o app. Confira em Implantar › Gerenciar implantações se a versão nova foi publicada, com acesso "Qualquer pessoa", e se o endereço é o mesmo do config.js.'); x.codigo = 'SERVIDOR'; throw x; })
    .then(function (j) {
      if (j === null || typeof j !== 'object') throw new Error('Resposta inesperada do servidor.');
      if (j && j.ok) return j.dados;
      var e = new Error((j && j.erro) || 'Erro no servidor'); e.codigo = j && j.codigo;
      if (e.codigo === 'SESSAO' && S.token) { sairLocal(); telaPin(); toast('Sessão expirada. Digite o PIN de novo.', true); }
      throw e;
    });
}

/* Autocomplete simples (melhor que datalist no iPhone) */
function autocompletar(input, box, fonte, onPick) {
  function render() {
    var v = norm(input.value); if (!v) { box.innerHTML = ''; box.classList.add('hide'); return; }
    var itens = fonte().filter(function (n) { return norm(n).indexOf(v) >= 0 && norm(n) !== v; }).slice(0, 5);
    if (!itens.length) { box.innerHTML = ''; box.classList.add('hide'); return; }
    box.innerHTML = itens.map(function (n) { return '<button type="button" data-n="' + esc(n) + '"><span class="av">' + esc(n.charAt(0).toUpperCase()) + '</span>' + esc(n) + '</button>'; }).join('');
    box.classList.remove('hide');
    $$('button', box).forEach(function (b) { b.onclick = function () { input.value = b.dataset.n; box.classList.add('hide'); onPick(b.dataset.n); }; });
  }
  input.addEventListener('input', render);
  input.addEventListener('blur', function () { setTimeout(function () { box.classList.add('hide'); }, 180); });
}

<script>
/* ============ Avisos no celular (Web Push pelo Firebase Cloud Messaging) ============
   O servidor decide QUANDO avisar; aqui o aparelho pede permissão, registra o endereço e escolhe os tipos.
   No iPhone, só funciona com o app instalado na tela de início (iOS 16.4 ou mais novo). */
var FB_VERSAO = '10.14.1', PUSH = { cfg: null };
function pushOk() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function iosApp() { return /iphone|ipad|ipod/i.test(navigator.userAgent || ''); }
function instalado() { return window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches); }
function pushTipos() { var t = store('pushTipos'); return t ? t.split(',').filter(Boolean) : null; }
function carregarJs(src) { return new Promise(function (ok, erro) { if (document.querySelector('script[src="' + src + '"]')) return ok(); var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = function () { erro(new Error('Sem internet para ativar os avisos.')); }; document.head.appendChild(s); }); }
function tokenFirebase(cfg) {
  var base = 'https://www.gstatic.com/firebasejs/' + FB_VERSAO + '/';
  return carregarJs(base + 'firebase-app-compat.js').then(function () { return carregarJs(base + 'firebase-messaging-compat.js'); })
    .then(function () { if (!firebase.apps.length) firebase.initializeApp(cfg.webConfig); return navigator.serviceWorker.ready; })
    .then(function (reg) { return firebase.messaging().getToken({ vapidKey: cfg.vapidKey, serviceWorkerRegistration: reg }); });
}
function pushCfg() { return PUSH.cfg ? Promise.resolve(PUSH.cfg) : api({ acao: 'pushConfig', token: S.token }).then(function (c) { PUSH.cfg = c; return c; }); }
function avisosSheet() {
  var tok = store('pushToken'), corpo;
  var cab = '<h3>Avisos no celular</h3>';
  if (!pushOk()) corpo = '<p class="desc">' + (iosApp() && !instalado() ? 'No iPhone, os avisos só funcionam com o app <b>instalado na tela de início</b> (iOS 16.4 ou mais novo). No Safari: Compartilhar › Adicionar à Tela de Início, e abra pelo ícone RM.' : 'Este navegador não recebe avisos. No Android use o Chrome; no computador, Chrome, Edge ou Safari.') + '</p>';
  else if (Notification.permission === 'denied') corpo = '<p class="desc">Os avisos estão bloqueados para o RM neste aparelho. ' + (iosApp() ? 'Libere em <b>Ajustes do iPhone › Notificações › RM</b>.' : 'Libere nas configurações do site.') + '</p>';
  else if (tok && Notification.permission === 'granted') {
    var tipos = pushTipos() || [], nomes = (PUSH.cfg && PUSH.cfg.tipos) || {};

      Object.keys(nomes).map(function (k) { return '<label class="av-i"><input type="checkbox" data-t="' + k + '"' + (tipos.indexOf(k) >= 0 ? ' checked' : '') + '><span>' + esc(nomes[k]) + '</span></label>'; }).join('') +
      '</div><div class="btns"><button class="btn sec" id="avTeste">Enviar um teste</button><button class="btn sec" id="avOff">Desligar neste aparelho</button></div>';
    if (!PUSH.cfg) pushCfg().then(function () { if ($('#avTeste')) avisosSheet(); }).catch(function () {});
  } else corpo = '<p class="desc">Receba no celular o bom dia com as tarefas, a véspera das retiradas, Pix pendente, a lista de produção, o lembrete do estoque e o painel da semana. Você escolhe quais depois.</p><button class="btn" id="avOn">' + ic('bell', 's') + 'Ativar avisos</button>';
  var sh = sheet(cab + corpo);
  var on = $('#avOn', sh), off = $('#avOff', sh), te = $('#avTeste', sh);
  if (on) on.onclick = function () {
    // No iPhone o pedido de permissão precisa ser a primeira coisa depois do toque
    Notification.requestPermission().then(function (perm) {
      if (perm !== 'granted') { toast('Sem permissão o app não consegue avisar. Dá para liberar depois nos Ajustes.', true); return avisosSheet(); }
      on.disabled = true; on.textContent = 'Ativando…';
      return pushCfg().then(function (cfg) {

        return tokenFirebase(cfg).then(function (t) {
          if (!t) throw new Error('O aparelho não devolveu o endereço de aviso. Tente de novo.');
          var tipos = pushTipos() || cfg.padrao || [];
          return api({ acao: 'registrarPush', token: S.token, token_push: t, plataforma: iosApp() ? 'iPhone' : (/Android/.test(navigator.userAgent) ? 'Android' : 'computador'), tipos: tipos })
            .then(function (r) { store('pushToken', t); store('pushTipos', r.tipos.join(',')); store('pushVerif', S.boot ? S.boot.hoje : ''); toast('Avisos ativados neste aparelho.', false, { label: 'Testar', fn: function () { api({ acao: 'testarPush', token: S.token, token_push: t }).then(function () { toast('Enviado. Deve chegar em alguns segundos.'); }).catch(fail); } }); avisosSheet(); });
        });
      });
    }).catch(function (e) { toast(msgErro(e), true); avisosSheet(); });
  };
  $$('.av-i input', sh).forEach(function (c) { c.onchange = function () {
    var atuais = pushTipos() || [], k = c.dataset.t, novos = c.checked ? atuais.concat(atuais.indexOf(k) >= 0 ? [] : [k]) : atuais.filter(function (x) { return x !== k; });
    store('pushTipos', novos.join(','));
    api({ acao: 'preferenciasPush', token: S.token, token_push: store('pushToken'), tipos: novos }).catch(function (e) { store('pushTipos', atuais.join(',')); c.checked = !c.checked; fail(e); });
  }; });
  if (te) te.onclick = function () { te.disabled = true; api({ acao: 'testarPush', token: S.token, token_push: store('pushToken') }).then(function () { toast('Enviado. Deve chegar em alguns segundos.'); }).catch(fail).then(function () { te.disabled = false; }); };
  if (off) off.onclick = function () {
    var t = store('pushToken'); store('pushToken', ''); store('pushVerif', '');
    api({ acao: 'removerPush', token: S.token, token_push: t }).catch(function () {});
    try { if (window.firebase && firebase.apps.length) firebase.messaging().deleteToken(); } catch (e) {}

  };
}
/* Uma vez por dia confere o endereço (o Firebase pode trocá-lo) e limpa se a permissão foi retirada */
function revisarPush() {
  var tok = store('pushToken'); if (!tok || !S.token || !pushOk() || window.MOCK) return;
  if (Notification.permission !== 'granted') { api({ acao: 'removerPush', token: S.token, token_push: tok }).catch(function () {}); store('pushToken', ''); return; }
  var hoje = new Date().toISOString().slice(0, 10); if (store('pushVerif') === hoje) return;
  pushCfg().then(function (cfg) { if (!cfg.ativo) return; return tokenFirebase(cfg).then(function (novo) {
    if (novo && novo !== tok) api({ acao: 'removerPush', token: S.token, token_push: tok }).catch(function () {});
    return api({ acao: 'registrarPush', token: S.token, token_push: novo || tok, plataforma: iosApp() ? 'iPhone' : 'outro', tipos: pushTipos() || cfg.padrao || [] })
      .then(function (r) { store('pushToken', novo || tok); store('pushTipos', r.tipos.join(',')); store('pushVerif', hoje); });
  }); }).catch(function () {});
}
setTimeout(revisarPush, 8000);
/* Tocar num aviso abre o app na tela certa (o service worker avisa qual) */
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', function (e) { var v = e.data && e.data.ir && String(e.data.ir).replace(/^#\/?/, ''); if (v && S.token && ['hoje', 'pedidos', 'gestao', 'plano', 'estoque'].indexOf(v) >= 0) go(v); });
</script>
